<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Produtos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Gerenciador de Produtos</h1>
    <span class="badge" id="totalProdutos">0 produtos</span>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="formTitulo">Novo produto</h2>
      <form id="produtoForm">
        <input type="hidden" id="produtoId" />

        <label for="nome">Nome</label>
        <input type="text" id="nome" required placeholder="Ex: Teclado Mecanico" />

        <label for="preco">Preco</label>
        <input type="number" id="preco" step="0.01" min="0.01" required placeholder="0.00" />

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" placeholder="Ex: Perifericos" />

        <label for="estoque">Estoque</label>
        <input type="number" id="estoque" min="0" step="1" placeholder="0" />

        <div class="form-actions">
          <button type="submit" id="submitBtn">Adicionar</button>
          <button type="button" id="cancelarBtn" class="secondary hidden">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="lista-header">
        <h2>Produtos</h2>
        <input type="search" id="buscaInput" placeholder="Buscar por nome..." />
      </div>

      <p id="mensagem" class="mensagem hidden"></p>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preco</th>
            <th>Estoque</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="produtosTbody"></tbody>
      </table>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
