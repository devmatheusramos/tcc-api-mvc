<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow | Gestao de produtos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="intro">
      <span class="brand">StockFlow</span>
      <h1>Produtos organizados. Operacoes sob controle.</h1>
      <p>Gerencie catalogo e estoque em uma interface conectada a uma API com processamento assincrono e acompanhamento em tempo real.</p>
      <div class="features" aria-label="Recursos do sistema">
        <span>CRUD de produtos</span><span>Fila de processamento</span><span>API documentada</span>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-mode="login">Entrar</button>
        <button type="button" class="auth-tab" data-mode="register">Criar conta</button>
      </div>
      <form id="authForm">
        <div id="nomeGroup" class="hidden">
          <label for="authNome">Nome</label>
          <input id="authNome" type="text" autocomplete="name" placeholder="Seu nome" />
        </div>
        <label for="authEmail">E-mail</label>
        <input id="authEmail" type="email" autocomplete="email" required placeholder="voce@email.com" />
        <label for="authSenha">Senha</label>
        <input id="authSenha" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimo de 6 caracteres" />
        <p id="authMensagem" class="mensagem erro hidden"></p>
        <button type="submit" id="authSubmit">Entrar no sistema</button>
      </form>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
